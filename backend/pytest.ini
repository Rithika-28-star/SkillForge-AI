# pytest.ini
# Configuration file for pytest (Python test runner).
# pytest reads this automatically when you run "pytest" in the backend folder.

[pytest]
# Tell pytest where to find test files
testpaths = tests

# Show extra details: -v = verbose, -s = show print() output
addopts = -v -s

# Minimum pytest version required
minversion = 7.0

# Silence the pytest-asyncio deprecation warning about fixture loop scope.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
